version: "3.8"

services:

    backend:
        build: "../weblab_backend"
        environment:
            - BACKEND_DEBUG=${BACKEND_DEBUG:-True}
            - BACKEND_ADDRESS=${BACKEND_ADDRESS:-0.0.0.0}
            - BACKEND_PORT=${BACKEND_PORT:-8000}
        volumes:
            - ../weblab_backend:/weblab_backend
        command: bash -c "python manage.py runserver ${BACKEND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000} || tail -F _"
        expose:
            - "${BACKEND_PORT:-8000}"
        ports:
            - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
